<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список покупок</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #e9edf1;
    color: #333;
    margin: 0;
    padding: 30px 20px;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    padding: 25px 30px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    margin-top: 0;
    color: #2c3e50;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .input-row input {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  #nameInput {
    flex: 2;
  }
  #priceInput {
    flex: 1;
  }
  #addBtn {
    padding: 10px 18px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4a90d9;
    color: #fff;
    border: none;
    border-radius: 5px;
  }
  #addBtn:hover {
    background-color: #3d7cc0;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child {
    border-bottom: none;
  }
  .item-name {
    flex: 1;
  }
  .item-price {
    color: #4a90d9;
    font-weight: bold;
    margin-right: 10px;
  }
  .del-btn {
    background: none;
    border: none;
    color: #d9534f;
    font-size: 18px;
    cursor: pointer;
    padding: 0 6px;
  }
  .del-btn:hover {
    color: #b52b27;
  }
  .empty-text {
    text-align: center;
    color: #999;
    padding: 10px 0;
  }
  .total {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px solid #eee;
    text-align: right;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const { useState } = React;

  function ShoppingItem({ item, onDelete }) {
    return (
      <li>
        <span className="item-name">{item.name}</span>
        <span className="item-price">{item.price} сом</span>
        <button className="del-btn" onClick={() => onDelete(item.id)}>✕</button>
      </li>
    );
  }

  function App() {
    const [items, setItems] = useState([]);
    const [name, setName] = useState("");
    const [price, setPrice] = useState("");

    function addItem() {
      if (name.trim() === "" || price.trim() === "" || isNaN(price)) {
        return;
      }
      const newItem = {
        id: Date.now(),
        name: name.trim(),
        price: parseFloat(price)
      };
      setItems([...items, newItem]);
      setName("");
      setPrice("");
    }

    function deleteItem(id) {
      setItems(items.filter(item => item.id !== id));
    }

    function handleKeyDown(e) {
      if (e.key === "Enter") {
        addItem();
      }
    }

    const total = items.reduce((sum, item) => sum + item.price, 0);

    return (
      <div className="container">
        <h1>Список покупок</h1>

        <div className="input-row">
          <input
            id="nameInput"
            type="text"
            placeholder="Товар"
            value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <input
            id="priceInput"
            type="number"
            placeholder="Цена"
            value={price}
            onChange={e => setPrice(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <button id="addBtn" onClick={addItem}>Добавить</button>
        </div>

        {items.length === 0 ? (
          <p className="empty-text">Список покупок пустой</p>
        ) : (
          <ul>
            {items.map(item => (
              <ShoppingItem key={item.id} item={item} onDelete={deleteItem} />
            ))}
          </ul>
        )}

        <div className="total">Итого: {total.toFixed(2)} сом</div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
